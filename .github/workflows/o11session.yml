name: o11session

# Builds the O11 Session plug-in on JUCE over the clean-room o11proto engine (plugin/), runs
# its tests (and o11proto's), checks the VST3 with Tracktion's pluginval (which also opens the
# editor) and uploads what users install.
#
# Day to day (pushes to main, pull requests) only macOS builds and tests: that's where the
# plug-in is tried by hand. Linux and Windows build too for a release candidate: a pushed tag
# rc<anything> (rc-3, rc0.2: a tag pushed, or a release made on GitHub), a manual run with
# "all platforms", or a manual run naming a release candidate ("rc") already made.
#
# Pushes and pull requests skip the five long Live timing tests (LONG_TESTS, about 14 of the
# 16 minutes on macOS). Those run every night on main, and on every release candidate or
# all-platforms run.

on:
  push:
    branches: [main]
    tags: ['rc*']
    paths: ['plugin/**', 'o11proto/**', '.github/workflows/o11session.yml']
  pull_request:
    paths: ['plugin/**', 'o11proto/**', '.github/workflows/o11session.yml']
  schedule:
    - cron: '0 2 * * *'   # nightly, main, every test
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Build and test on Linux and Windows too, as for a release candidate
        type: boolean
        default: false
      rc:
        description: A release candidate already made (its tag, e.g. rc0.2) to build main for and fill
        type: string
        default: ''

permissions:
  contents: read

env:
  # the long Live timing tests, and whether this run includes them
  LONG_TESTS: '^test_engine_live(_room|_tone|_paths|_stalls)?$'
  FULL_TESTS: ${{ startsWith(github.ref, 'refs/tags/rc') || inputs.all_platforms || inputs.rc != '' || github.event_name == 'schedule' }}
  # pluginval release and the SHA-256 of each of its zips
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SHA256_LINUX: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  # pluginval v1.0.4 validates in its own process (it has no --validate-in-process flag) and
  # runs the tests that open the editor unless --skip-gui-tests is given, so neither is passed.
  PLUGINVAL_ARGS: --strictness-level 10 --timeout-ms 120000 --output-dir pluginval-logs
  # where juce_add_plugin puts the bundle (single-configuration generator, Release)
  BUNDLE: build/O11Session_artefacts/Release/VST3/O11Session.vst3

jobs:
  linux:
    if: startsWith(github.ref, 'refs/tags/rc') || inputs.all_platforms || inputs.rc != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test packages
        run: |
          sudo apt-get update
          # what JUCE's GUI needs on Linux; Xvfb (and ALSA, which pluginval links) for the
          # editor tests. Opus, FLAC and JUCE themselves are fetched by CMake.
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig-dev \
            xvfb xauth libasound2t64
          # the unit test also reads and writes the state in a locale that writes 95,5
          sudo locale-gen de_DE.UTF-8

      - name: Configure
        run: cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DO11_TESTS=ON

      - name: Build
        run: |
          cmake --build build -- -k 0
          # what gets validated, tested and shipped
          strip --strip-unneeded "$BUNDLE/Contents/x86_64-linux/O11Session.so"
          ls -l "$BUNDLE/Contents/x86_64-linux/"

      - name: pluginval (with the editor, under Xvfb)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Linux.zip"
          echo "$PLUGINVAL_SHA256_LINUX  pluginval.zip" | sha256sum -c -
          unzip -q -o pluginval.zip -d pluginval
          xvfb-run -a -s "-screen 0 1400x900x24" pluginval/pluginval $PLUGINVAL_ARGS --validate "$BUNDLE"

      - name: Tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Package
        run: |
          mkdir -p dist
          cp -R "$BUNDLE" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: O11Session-linux-x86_64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-o11session-linux
          path: pluginval-logs/
          if-no-files-found: ignore

  windows:
    if: startsWith(github.ref, 'refs/tags/rc') || inputs.all_platforms || inputs.rc != ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, static runtime)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where ninja >nul 2>nul || choco install ninja --no-progress -y || exit /b 1
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DO11_TESTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW || exit /b 1
          cmake --build build -- -k 0 || exit /b 1

      - name: Find the plug-in
        shell: bash
        run: |
          PLUGIN=$(find "$BUNDLE" -name O11Session.vst3 -type f | head -1)
          test -n "$PLUGIN"
          echo "PLUGIN=$PLUGIN" >> "$GITHUB_ENV"
          ls -l "$PLUGIN"

      - name: DLLs it needs (no Visual C++ runtime)
        shell: bash
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          DUMPBIN=$(cygpath -u "$("$VSWHERE" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -1 | tr -d '\r')")
          MSYS_NO_PATHCONV=1 "$DUMPBIN" /nologo /dependents "$PLUGIN" | tee dependents.txt
          if grep -i -E "vcruntime|msvcp|ucrtbase|api-ms-win-crt" dependents.txt; then
            echo "O11Session.vst3 needs the Visual C++ runtime; it should be built with /MT"
            exit 1
          fi

      - name: pluginval (with the editor)
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          echo "$PLUGINVAL_SHA256_WINDOWS  pluginval.zip" | sha256sum -c -
          7z x -y -opluginval pluginval.zip
          pluginval/pluginval.exe $PLUGINVAL_ARGS --validate "$BUNDLE" && status=0 || status=$?
          cat pluginval-logs/*.txt || true
          exit $status

      - name: Tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "$BUNDLE" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: O11Session-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-o11session-windows
          path: |
            dependents.txt
            pluginval-logs/
          if-no-files-found: ignore

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure (universal, macOS 12 and later)
        run: cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DO11_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build -- -k 0

      - name: Strip and sign (ad hoc)
        run: |
          strip -x "$BUNDLE/Contents/MacOS/O11Session"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"

      - name: Check the bundle
        run: |
          BIN="$BUNDLE/Contents/MacOS/O11Session"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -w arm64 && lipo -archs "$BIN" | grep -w x86_64
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep minos
          plutil -p "$BUNDLE/Contents/Info.plist"
          test "$(plutil -extract CFBundlePackageType raw "$BUNDLE/Contents/Info.plist")" = BNDL

      - name: Tests
        run: |
          if [ "$FULL_TESTS" = true ]; then
            ctest --test-dir build --output-on-failure -V
          else
            ctest --test-dir build --output-on-failure -V -E "$LONG_TESTS"
          fi

      - name: Split into Apple silicon and Intel bundles
        run: |
          # One download per architecture, each half the size of the universal bundle: the
          # build and the tests above stay universal, and lipo keeps one slice of each copy.
          for ARCH in arm64 x86_64; do
            B="build/split/$ARCH/O11Session.vst3"
            mkdir -p "build/split/$ARCH"
            ditto "$BUNDLE" "$B"
            lipo -thin "$ARCH" "$B/Contents/MacOS/O11Session" -output "$B/Contents/MacOS/O11Session.thin"
            mv "$B/Contents/MacOS/O11Session.thin" "$B/Contents/MacOS/O11Session"
            test "$(lipo -archs "$B/Contents/MacOS/O11Session")" = "$ARCH"
            codesign --force --deep --sign - "$B"
            codesign --verify --deep --strict --verbose=2 "$B"
            du -sh "$B"
          done

      - name: Are there Developer ID secrets?
        id: devid
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets: the bundle stays ad hoc signed and isn't notarized."
          fi

      - name: Sign with Developer ID, notarize and staple
        if: steps.devid.outputs.notarize == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then echo "MACOS_CERT_P12 has no Developer ID Application certificate"; exit 1; fi
          echo "DEVID_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          for ARCH in arm64 x86_64; do
          B="build/split/$ARCH/O11Session.vst3"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$B"
          codesign --verify --deep --strict --verbose=2 "$B"

          rm -f "$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$B" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notarize.json" || true
          cat "$RUNNER_TEMP/notarize.json"
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notarize.json" 2>/dev/null || echo unknown)
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization: $STATUS"
            ID=$(plutil -extract id raw "$RUNNER_TEMP/notarize.json" 2>/dev/null || true)
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$B"
          xcrun stapler validate "$B"
          codesign --verify --deep --strict --verbose=2 "$B"
          done

      - name: pluginval (with the editor)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          echo "$PLUGINVAL_SHA256_MACOS  pluginval.zip" | shasum -a 256 -c -
          ditto -x -k pluginval.zip pluginval
          pluginval/pluginval.app/Contents/MacOS/pluginval $PLUGINVAL_ARGS --validate build/split/arm64/O11Session.vst3

      - name: Package
        run: |
          # Finder shows a folder whose extension no app has registered (like .vst3) as a plain
          # folder unless its bundle bit is set (kHasBundle in its Finder info), so set it: then
          # O11Session.vst3 shows as one file, like other plug-ins. It is set last, on a copy, after the
          # checks above, because codesign --strict rejects any extended attribute on the bundle;
          # the signature itself covers the files inside and stays valid. ditto zips the Finder
          # info of what is inside the folder it is given (not of that folder itself), the way
          # Finder's Compress does (--sequesterRsrc: in __MACOSX/), and unzipping restores it.
          mkdir -p dist
          for ARCH in arm64 x86_64; do
          rm -rf stage "$RUNNER_TEMP/unzipped"
          mkdir -p stage
          ditto "build/split/$ARCH/O11Session.vst3" stage/O11Session.vst3
          xattr -wx com.apple.FinderInfo 0000000000000000200000000000000000000000000000000000000000000000 stage/O11Session.vst3
          ZIP="dist/O11Session-macos-$ARCH.zip"
          ditto -c -k --sequesterRsrc stage "$ZIP"
          zipinfo -1 "$ZIP" | grep -Fx "__MACOSX/._O11Session.vst3"
          # what someone gets after unzipping: the bundle bit and a valid signature
          ditto -x -k "$ZIP" "$RUNNER_TEMP/unzipped"
          UNZIPPED="$RUNNER_TEMP/unzipped/O11Session.vst3"
          test "$(xattr -px com.apple.FinderInfo "$UNZIPPED" | tr -d ' \n' | cut -c17-20)" = 2000
          test "$(lipo -archs "$UNZIPPED/Contents/MacOS/O11Session")" = "$ARCH"
          codesign --verify --deep --verbose=2 "$UNZIPPED"
          done
          ls -l dist

      - name: Disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARIZE: ${{ steps.devid.outputs.notarize }}
        run: |
          # The Mac download: a disk image with O11Session.vst3 next to a shortcut to the VST3
          # folder, over a background that says to open the folder and drag the plug-in in (plugin/packaging).
          # dmgbuild lays it out in a read-write image; the bundle bit is set in there, for the
          # reasons above, and then the image is compressed, signed and notarized.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install -q dmgbuild==1.6.7
          for ARCH in arm64 x86_64; do
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s plugin/packaging/dmg_settings.py \
            -D bundle="build/split/$ARCH/O11Session.vst3" -D background=plugin/packaging/dmg-background.png \
            "O11 Session" "$RUNNER_TEMP/O11Session-$ARCH-rw.dmg"
          RW="$RUNNER_TEMP/dmg-rw"
          hdiutil attach -nobrowse -noautoopen -mountpoint "$RW" "$RUNNER_TEMP/O11Session-$ARCH-rw.dmg"
          xattr -wx com.apple.FinderInfo 0000000000000000200000000000000000000000000000000000000000000000 "$RW/O11Session.vst3"
          hdiutil detach "$RW" || { sleep 5; hdiutil detach -force "$RW"; }
          DMG="dist/O11Session-macos-$ARCH.dmg"
          hdiutil convert "$RUNNER_TEMP/O11Session-$ARCH-rw.dmg" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          if [ "$NOTARIZE" = true ]; then
            codesign --force --timestamp --sign "$DEVID_IDENTITY" "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notarize-dmg-$ARCH.json" || true
            cat "$RUNNER_TEMP/notarize-dmg-$ARCH.json"
            STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notarize-dmg-$ARCH.json" 2>/dev/null || echo unknown)
            if [ "$STATUS" != "Accepted" ]; then echo "Notarization of the disk image: $STATUS"; exit 1; fi
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          fi
          ls -l dist
          # what someone gets: the shortcut, the layout, the bundle bit, a valid signature
          RO="$RUNNER_TEMP/dmg-check"
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$RO" "$DMG"
          ls -la "$RO"
          test "$(readlink "$RO/VST3 Plug-Ins")" = /Library/Audio/Plug-Ins/VST3
          test -f "$RO/.DS_Store"
          ls "$RO"/.background.*
          test "$(xattr -px com.apple.FinderInfo "$RO/O11Session.vst3" | tr -d ' \n' | cut -c17-20)" = 2000
          codesign --verify --deep --verbose=2 "$RO/O11Session.vst3"
          hdiutil detach "$RO"
          done

      # the README's one-line install, on the build already published (it checks the signature)
      - name: Install script (the published build)
        run: |
          HOME="$RUNNER_TEMP/home" sh plugin/install.sh
          test -d "$RUNNER_TEMP/home/Library/Audio/Plug-Ins/VST3/O11Session.vst3"

      - name: Remove the signing keychain
        if: always() && steps.devid.outputs.notarize == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: O11Session-macos
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-o11session-macos
          path: pluginval-logs/
          if-no-files-found: ignore

  # The downloads in the README: each push to main puts its macOS build in the release
  # "o11session-latest" (the tag moves to the commit), replacing the files there; Linux and
  # Windows are replaced only by a build of all three. A release candidate (tag rc*, or a manual
  # run naming one) also gets its own release with all three.
  release:
    if: >-
      always() && needs.macos.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/rc') || inputs.rc != '' ||
       (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: o11session-latest
      ALL: ${{ needs.linux.result == 'success' && needs.windows.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.linux.result == 'success'
        with:
          name: O11Session-linux-x86_64
          path: linux

      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: O11Session-windows-x64
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: O11Session-macos
          path: macos

      - name: Zip the downloads
        run: |
          mkdir release
          if [ "$ALL" = true ]; then
            (cd linux && zip -qr ../release/O11Session-linux-x86_64.zip O11Session.vst3)
            (cd windows && zip -qr ../release/O11Session-windows-x64.zip O11Session.vst3)
          fi
          # made on the Mac, with the bundle bit (see the macos job)
          cp macos/O11Session-macos-*.dmg macos/O11Session-macos-*.zip release/
          ls -l release

      - name: Publish to the o11session-latest release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rc')
        run: |
          if [ "$ALL" = true ]; then
            NOTES="The newest build of O11 Session, from ${GITHUB_SHA::7}, on every platform. See the README for how to install it."
          else
            NOTES="The newest build of O11 Session. The Mac files are from ${GITHUB_SHA::7} on main; the Windows and Linux files are from the last release candidate. See the README for how to install it."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "O11 Session (latest build)" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "O11 Session (latest build)" --notes "$NOTES" --latest
          fi
          # the universal Mac files of older builds, replaced by one per architecture
          for OLD in O11Session-macos.dmg O11Session-macos.zip; do
            gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          done
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release candidate
        if: startsWith(github.ref, 'refs/tags/rc') || inputs.rc != ''
        env:
          RC_INPUT: ${{ inputs.rc }}
        run: |
          RC="${RC_INPUT:-$GITHUB_REF_NAME}"
          NOTES="Release candidate $RC of O11 Session, from ${GITHUB_SHA::7}, for testing by hand. See the README for how to install it."
          if gh release view "$RC" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RC" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$RC" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "O11 Session $RC" --notes "$NOTES"
          fi
          gh release upload "$RC" release/* --repo "$GITHUB_REPOSITORY" --clobber
